# Copy to ~/.config/gin-console/config.yaml (or point GIN_CONSOLE_CONFIG at it).
server:
  host: 127.0.0.1   # loopback only; exposed through `tailscale serve`
  port: 8700
# Pull every project's Beads from its Dolt remote on this interval (90s, 5m, 1h; at least 1m).
# Without it the console pulls only on "Refresh data".
# beads:
#   pull_interval: 5m
# Working days in progress before the Overview lists a bead (whole number, at least 1; default 3).
# Older installs refuse this key.
# overview:
#   aging_days: 3
# Sign-in (off by default). Create users first with `python -m gin_console user add`;
# with `enabled: true` the console refuses to start without a valid users file.
# auth:
#   enabled: false
#   users_file: ~/.config/gin-console/users.yaml
#   session_ttl: 12h        # how long a sign-in lasts (5m, 2h; at least 5m)
#   rate_limit:
#     per_user: 5           # failed sign-ins per username within the window
#     per_ip: 20            # failed sign-ins per client address within the window
#     window: 15m           # at least 1m
projects:
  - name: qwikfone
    path: /home/gin/qwikfone
    # Folders besides `path` whose screenshots this project's beads may show (absolute paths).
    # evidence_roots:
    #   - /home/gin/infra/bug-sync-mcp/data/attachments
  - name: scotty
    path: /home/gin/scotty
    pull: false   # never run `bd dolt pull` here
  - name: gin-workflow
    path: /home/gin/gin-workflow
