artifacts:
  beads: .beads
  evidence: .agent-workflow/runtime/evidence
  knowledge: .planning/knowledge
  layout: sdd
  plans: .planning/plans
  runtime: .agent-workflow/runtime
  worktrees: .planning/worktrees
capabilities: {}
harness: claude
model_tiers:
  brainstorm: high_reasoning
  design: high_reasoning
  docs: cheap_simple
  implement: standard_impl
  plan: high_reasoning
  review: high_reasoning
policy:
  approval:
    bind_to_scope: true
    ttl_seconds: 86400
project:
  monorepo: false
  review: independent
  review_ledger: false
  rigor: standard
  shape: fullstack
  stack_intent: React FastAPI
  stage: greenfield
  worktree: parallel
provider_mode: single
quick:
  max_files: 5
routing:
  circuit_breaker:
    failure_threshold: 3
  queue:
    max_wait_seconds: 600
  review:
    allow_self_review_fallback: false
    independence: session
    max_cycles: 2
    require_independent: true
    role: review
  roles:
    backend:
      preferred:
      - main_harness
    docs:
      preferred:
      - main_harness
    frontend:
      preferred:
      - main_harness
    general:
      preferred:
      - main_harness
    review:
      preferred:
      - main_harness
  worker:
    max_retries: 2
rules:
  packs:
  - core
  - python
  - typescript
  - fastapi
  - react
schema_version: '2.7'
setup_cli_version: '2.7'
verify:
  checks:
    build: pnpm -C frontend build
    e2e: ''
    lint: uv --directory backend run ruff check . && pnpm -C frontend lint
    test: uv --directory backend run pytest && pnpm -C frontend test --run
    typecheck: uv --directory backend run mypy && pnpm -C frontend typecheck
workflow_version: '2.7'
